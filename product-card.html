<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <style>
      :root {
        --main-color: #d48437;
        --card-color: #f6b560;
        --heading-color: #ffd399;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body.container {
        background-image: url(bg.jpg);
        font-family: Arial, sans-serif;
      }
      nav {
        display: flex;
        justify-content: flex-end;
        align-items: center;     
        padding: 20px;
      }

      .search-box {
        display: flex;
        width: 350px;
        height: 40px;
      }

      .search-input {
        width: 80%;
        height: 100%;
        border: 1px solid #ccc;
        border-right: none;
        border-radius: 8px 0 0 8px;
        padding: 6px;
      }

      .search-btn {
        width: 20%;
        height: 100%;
        border: 1px solid #ccc;
        border-left: none;
        border-radius: 0 8px 8px 0;
        background-color: var(--main-color);
        color: white;
        cursor: pointer;
      }

      nav > a {
        display: inline-block;
        margin: 12px;
        padding: 6px 16px;
        border: black solid 3px;
        border-radius: 45px;
        text-decoration: none;
        color: black;
        font-weight: bold;
        background-color: white;
        transition: background-color 0.3s;
      }

      nav > a:hover {
        background-color: lightgray;
      }

      .content {
        width: 90%;
        margin: 0 auto;
        background-color: var(--main-color);
        border-radius: 12px;
      }
      .types-label-wrapper {
        position: relative;
        text-align: left;
        padding-top: 20px;
        margin-left: 20px;
      }

      .types-label {
        background-color: #ffe5b4;
        border-radius: 30px;
        padding: 10px 24px;
        font-weight: bold;
        font-size: 22px;
        display: inline-block;
      }
      .book-list {
        text-align: center;
      }
      .image-container {
        position: relative;
        display: inline-block;
        width: 315px;
        height: 430px;
        overflow: hidden;
        border-radius: 8px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        text-overflow: ellipsis;
        background-color: white;
        margin: 45px;
      }

      .image-container img {
        width: 100%;
        height: 80%;
        object-fit: fill;
      }

      .info {
        position: absolute;
        bottom: 0;
        left: 0;
        background: var(--card-color);
        padding: 5px 10px;
        font-weight: bold;
        font-size: 20px;
        border-bottom-right-radius: 8px;
        width: 100%;
        height: 20%;
      }

      .overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.6);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: opacity 0.4s ease;
        padding: 10px;
        text-align: center;
      }

      .image-container:hover .overlay {
        opacity: 1;
      }

      .overlay figcaption p {
        margin-bottom: 6px;
        line-height: 1.4;
        font-size: 14px;
      }
      .pagination > a {
        text-decoration: none;
        padding: 8px 16px;
        background-color: var(--heading-color);
        margin: 0;
      }
      .pagination > a.active {
        background-color: red;
        color: white;
      }
      footer {
        text-align: center;
        padding: 20px;
        color: #333;
      }
      .pagination {
        margin: 0 auto;
        text-align: center;
        display: block;
        margin: 12px;
      }
    </style>
  </head>
